<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wheel & Tire Fitment 3D — 3スロット比較</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">3D</span>
      <h1>Fitment Studio</h1>
      <span class="subtitle">3スロット比較</span>
    </div>
    <div class="topbar-actions">
      <select id="presetSelect" title="車種プリセット">
        <option value="">プリセット読込...</option>
        <option value="civic_fc1">シビック (FC1/FK7系)</option>
        <option value="kei_standard">軽自動車 (デイズ/N-BOX等)</option>
        <option value="prius_50">プリウス / カローラ系</option>
        <option value="86_brz">86 / BRZ (ZN6/ZC6)</option>
        <option value="nd_roadster">ロードスター (ND)</option>
      </select>
      <button id="shareUrlBtn" class="btn btn-accent" title="現在の設定URLをコピー">URLコピー</button>
    </div>
  </header>

  <main class="layout">
    <!-- 3D ビューポート -->
    <section class="viewport-wrap">
      <div id="canvasContainer" class="canvas-container"></div>

      <!-- カメラ視点バー -->
      <div class="view-bar">
        <button class="view-btn active" data-view="iso">3D斜め</button>
        <button class="view-btn" data-view="front">正面(ツライチ)</button>
        <button class="view-btn" data-view="side">真横(外径)</button>
        <button class="view-btn" data-view="inner">裏側(ブレーキ)</button>
      </div>

      <!-- 表示モードバー -->
      <div class="mode-bar">
        <div class="segmented" id="partModeGroup">
          <button class="seg-btn active" data-mode="both">両方</button>
          <button class="seg-btn" data-mode="wheel">ホイールのみ</button>
          <button class="seg-btn" data-mode="tire">タイヤのみ</button>
        </div>
        <label class="chip-toggle">
          <input type="checkbox" id="crossSectionToggle" />
          <span>断面カット</span>
        </label>
      </div>

      <!-- 3スロット凡例 & クイック表示トグル -->
      <div class="legend-bar" id="legendBar"></div>

      <!-- 比較サマリーオーバーレイ -->
      <div class="hud-panel">
        <div class="hud-row" id="hudRow"></div>
      </div>
    </section>

    <!-- コントロールパネル -->
    <aside class="controls-panel">
      <!-- 3スロットタブ -->
      <div class="slot-tabs" id="slotTabs">
        <button class="slot-tab active" data-slot="0">
          <span class="dot dot-0"></span>
          <span>Slot A</span>
        </button>
        <button class="slot-tab" data-slot="1">
          <span class="dot dot-1"></span>
          <span>Slot B</span>
        </button>
        <button class="slot-tab" data-slot="2">
          <span class="dot dot-2"></span>
          <span>Slot C</span>
        </button>
      </div>

      <!-- アクティブスロット設定ヘッダー -->
      <div class="slot-meta-bar">
        <label class="meta-check">
          <input type="checkbox" id="slotEnabled" checked />
          <span>3Dに表示</span>
        </label>
        <label class="meta-check">
          <input type="checkbox" id="slotIsBase" />
          <span>比較の基準にする</span>
        </label>
        <input type="text" id="slotLabel" class="slot-label-input" placeholder="ラベル (例: 純正16)" maxlength="16" />
      </div>

      <!-- サイズ文字列パーサー -->
      <div class="quick-parse">
        <input type="text" id="tireStringInput" placeholder="例: 215/45R17" />
        <button id="tireParseBtn" class="btn">反映</button>
      </div>
      <div class="spec-summary" id="slotSummary">--</div>

      <!-- スライダー群 -->
      <div class="sliders-area">
        <div class="control-group">
          <div class="control-head"><span>インチ (リム径)</span><strong id="val_inch">18"</strong></div>
          <input type="range" id="inp_inch" min="13" max="22" step="1" />
        </div>
        <div class="control-group">
          <div class="control-head"><span>J数 (リム幅)</span><strong id="val_j">8.0J</strong></div>
          <input type="range" id="inp_j" min="4.5" max="12.0" step="0.5" />
        </div>
        <div class="control-group">
          <div class="control-head"><span>インセット (オフセット)</span><strong id="val_et">+38 mm</strong></div>
          <input type="range" id="inp_et" min="-20" max="70" step="1" />
        </div>
        <div class="control-group">
          <div class="control-head"><span>スペーサー厚</span><strong id="val_spacer">0 mm</strong></div>
          <input type="range" id="inp_spacer" min="0" max="30" step="1" />
        </div>
        <hr class="divider" />
        <div class="control-group">
          <div class="control-head"><span>タイヤ幅</span><strong id="val_width">225 mm</strong></div>
          <input type="range" id="inp_width" min="135" max="335" step="5" />
        </div>
        <div class="control-group">
          <div class="control-head"><span>扁平率</span><strong id="val_aspect">40 %</strong></div>
          <input type="range" id="inp_aspect" min="25" max="85" step="5" />
        </div>
        <div class="control-group">
          <div class="control-head"><span>簡易キャンバー (ネガ)</span><strong id="val_camber">0.0°</strong></div>
          <input type="range" id="inp_camber" min="0" max="6" step="0.5" />
        </div>
      </div>

      <!-- 3スロット実測比較テーブル -->
      <div class="metrics-box">
        <div class="metrics-title" id="metricsTitle">基準比 比較表 (mm)</div>
        <table class="metrics-table">
          <thead>
            <tr>
              <th>項目</th>
              <th class="col-0">A</th>
              <th class="col-1">B</th>
              <th class="col-2">C</th>
            </tr>
          </thead>
          <tbody id="metricsBody"></tbody>
        </table>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast">URLをコピーしました</div>

  <script type="module" src="app.js"></script>
</body>
</html>
