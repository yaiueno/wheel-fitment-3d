<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fitment Studio — 2D断面 × 3D統合比較</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">FITMENT</span>
      <h1>タイヤ・ホイール統合比較</h1>
    </div>
    <div class="topbar-actions">
      <select id="presetSelect" title="車種プリセット">
        <option value="">車種プリセット...</option>
        <option value="civic_fc1">シビック (FC1/FK7)</option>
        <option value="kei_standard">軽 (デイズ/N-BOX)</option>
        <option value="prius_50">プリウス/カローラ</option>
        <option value="86_brz">86 / BRZ</option>
        <option value="nd_roadster">ロードスター (ND)</option>
      </select>
      <button id="shareUrlBtn" class="btn btn-primary">URLをコピー</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage-wrap">
      <!-- ツールバー上段: 2D / 3D 統合切替 & 表示オプション -->
      <div class="stage-toolbar">
        <div class="seg-group" id="renderModeGroup">
          <button class="seg-btn active" data-render="2d">2D 精密断面</button>
          <button class="seg-btn" data-render="3d">3D 立体</button>
        </div>

        <div class="seg-group" id="partModeGroup">
          <button class="seg-btn active" data-mode="both">両方</button>
          <button class="seg-btn" data-mode="wheel">ホイール</button>
          <button class="seg-btn" data-mode="tire">タイヤ</button>
        </div>

        <label class="toggle-chip" id="arrangeWrap" hidden>
          <input type="checkbox" id="arrangeToggle" />
          <span>並べて表示</span>
        </label>

        <label class="toggle-chip" id="crossWrap" hidden>
          <input type="checkbox" id="crossSectionToggle" />
          <span>断面カット</span>
        </label>

        <div class="view-group" id="viewBar" hidden>
          <button class="mini-btn active" data-view="iso">斜め</button>
          <button class="mini-btn" data-view="front">正面</button>
          <button class="mini-btn" data-view="side">真横</button>
          <button class="mini-btn" data-view="inner">裏側</button>
        </div>

        <div class="legend-inline" id="legendBar"></div>
      </div>

      <!-- 2D 精密図面キャンバス -->
      <div id="canvas2dWrap" class="canvas-stage">
        <canvas id="canvas2d"></canvas>
      </div>

      <!-- 3D 立体キャンバス -->
      <div id="canvas3dWrap" class="canvas-stage" hidden>
        <div id="canvasContainer" class="canvas-3d-inner"></div>
      </div>

      <div id="errorBanner" class="error-banner" hidden></div>

      <!-- 下部 3スロット比較サマリー -->
      <div class="hud-bar" id="hudRow"></div>
    </section>

    <aside class="sidebar">
      <div class="slot-tabs" id="slotTabs">
        <button class="slot-tab active" data-slot="0">
          <span class="dot dot-0"></span><span>Slot A</span>
        </button>
        <button class="slot-tab" data-slot="1">
          <span class="dot dot-1"></span><span>Slot B</span>
        </button>
        <button class="slot-tab" data-slot="2">
          <span class="dot dot-2"></span><span>Slot C</span>
        </button>
      </div>

      <div class="slot-meta">
        <label class="check-label">
          <input type="checkbox" id="slotEnabled" checked /><span>表示</span>
        </label>
        <label class="check-label">
          <input type="checkbox" id="slotIsBase" /><span>基準にする</span>
        </label>
        <input type="text" id="slotLabel" class="label-input" placeholder="ラベル" maxlength="14" />
      </div>

      <div class="quick-parse">
        <input type="text" id="tireStringInput" placeholder="例: 215/45R17 7.5J +45" />
        <button id="tireParseBtn" class="btn">反映</button>
      </div>

      <div class="num-grid">
        <label class="num-field">
          <span>インチ</span>
          <input type="number" id="inp_inch" min="10" max="24" step="1" />
        </label>
        <label class="num-field">
          <span>J数 (リム幅)</span>
          <input type="number" id="inp_j" min="3.5" max="14" step="0.5" />
        </label>
        <label class="num-field">
          <span>インセット (mm)</span>
          <input type="number" id="inp_et" min="-50" max="80" step="1" />
        </label>
        <label class="num-field">
          <span>スペーサー (mm)</span>
          <input type="number" id="inp_spacer" min="0" max="50" step="1" />
        </label>
        <label class="num-field">
          <span>タイヤ幅 (mm)</span>
          <input type="number" id="inp_width" min="115" max="355" step="5" />
        </label>
        <label class="num-field">
          <span>扁平率 (%)</span>
          <input type="number" id="inp_aspect" min="20" max="90" step="5" />
        </label>
        <label class="num-field">
          <span>キャンバー (°)</span>
          <input type="number" id="inp_camber" min="0" max="10" step="0.5" />
        </label>
        <div class="spec-badge" id="slotSummary">--</div>
      </div>

      <div class="metrics-box">
        <div class="metrics-title" id="metricsTitle">基準比 比較表 (mm)</div>
        <table class="metrics-table">
          <thead>
            <tr>
              <th>項目</th>
              <th class="col-0">A</th>
              <th class="col-1">B</th>
              <th class="col-2">C</th>
            </tr>
          </thead>
          <tbody id="metricsBody"></tbody>
        </table>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast">URLをコピーしました</div>
  <script type="module" src="app.js?v=5"></script>
</body>
</html>
